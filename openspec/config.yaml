schema: spec-driven

context: |
  # agent-mobile

  CLI tool for AI agents to control iOS simulators. The "agent-browser for iOS."

  ## Tech Stack
  - TypeScript, Node.js 18+
  - Commander.js for CLI
  - WebDriverIO for Appium client
  - Appium with XCUITest driver for iOS automation

  ## Architecture
  - Snapshot + refs pattern (@e1, @e2) for token-efficient LLM interaction
  - Session persistence in /tmp/agent-mobile-session.json
  - Commands: open, snapshot, tap, fill, swipe, screenshot, close

  ## Conventions
  - Keep CLI output compact and LLM-friendly
  - Refs format: @e1, @e2, etc.
  - Bundle IDs for iOS apps (e.g., com.apple.calculator)

  ## Target Users
  - AI coding assistants (Claude Code, Cursor, Windsurf)
  - Developers building AI-powered mobile testing

rules:
  proposal:
    - Keep proposals concise (under 300 words)
    - Always include a "Non-goals" section
    - Focus on what changes for the CLI user experience
  tasks:
    - Each task should be completable in one focused session
    - Include acceptance criteria
    - Reference specific files when known
